name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download AML headers
        run: git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml
      - name: Build with NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: libInteractivePeds
          path: libs/armeabi-v7a/libInteractivePeds.so
