name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        aml_ref: ["1.1", "1.2.1", "main"]
    steps:
      - uses: actions/checkout@v4
      - name: Download AML headers (${{ matrix.aml_ref }})
        run: |
          git clone --depth 1 --branch ${{ matrix.aml_ref }} https://github.com/RusJJ/AndroidModLoader aml
          [ -d aml/mod ] || cp -r aml/include/mod aml/mod
      - name: Build with NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: libInteractivePeds-${{ matrix.aml_ref }}
          path: libs/armeabi-v7a/libInteractivePeds.so
